services:
  goomni:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    image: ${APP_IMAGE:-docker.io/mimalef70/goomni:v2.3.0}
    build:
      context: .
      dockerfile: docker/golang.Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 3000
      APP_BASE_PATH: ${APP_BASE_PATH:-}
      APP_UI_ENABLED: ${APP_UI_ENABLED:-true}
      APP_UI_PUBLIC_ORIGIN: ${APP_UI_PUBLIC_ORIGIN:-}
      APP_BASIC_AUTH: ${APP_BASIC_AUTH:?Run goomni init first}
      APP_MASTER_KEY: ${APP_MASTER_KEY:?Export APP_MASTER_KEY from master.key}
      APP_MASTER_KEY_FILE: ""
      APP_DATABASE: ${APP_DATABASE:-/app/storages/goomni.db}
      APP_MEDIA_ROOT: ${APP_MEDIA_ROOT:-/app/storages/media}
      APP_MAX_MEDIA_BYTES: ${APP_MAX_MEDIA_BYTES:-67108864}
      APP_SEND_WORKERS: ${APP_SEND_WORKERS:-4}
      APP_WEBHOOK_WORKERS: ${APP_WEBHOOK_WORKERS:-8}
      APP_RECONNECT_WORKERS: ${APP_RECONNECT_WORKERS:-4}
      APP_MEDIA_WORKERS: ${APP_MEDIA_WORKERS:-4}
      APP_QUEUE_LIMIT: ${APP_QUEUE_LIMIT:-1000}
      APP_CONNECTION_QUEUE_LIMIT: ${APP_CONNECTION_QUEUE_LIMIT:-100}
      BALE_GRPC_ENDPOINT: ${BALE_GRPC_ENDPOINT:-https://next-ws.bale.ai}
      BALE_WS_ENDPOINT: ${BALE_WS_ENDPOINT:-wss://next-ws.bale.ai/ws/}
      BALE_APP_ID: ${BALE_APP_ID:-0}
      BALE_API_KEY: ${BALE_API_KEY:-}
      BALE_API_VERSION: ${BALE_API_VERSION:-173855}
      EITAA_ENABLED: ${EITAA_ENABLED:-false}
      EITAA_ENDPOINT: ${EITAA_ENDPOINT:-https://hasan.eitaa.ir/eitaa/}
      EITAA_UPLOAD_ENDPOINT: ${EITAA_UPLOAD_ENDPOINT:-https://alzheimer.eitaa.com/eitaa/}
      EITAA_DOWNLOAD_ENDPOINT: ${EITAA_DOWNLOAD_ENDPOINT:-https://mohsen.eitaa.com/eitaa/}
      EITAA_API_ID: ${EITAA_API_ID:-2496}
      EITAA_API_HASH: ${EITAA_API_HASH:-8da85b0d5bfe62527e5b244c209159c3}
      EITAA_POLL_INTERVAL: ${EITAA_POLL_INTERVAL:-5s}
      RUBIKA_ENABLED: ${RUBIKA_ENABLED:-false}
      RUBIKA_DISCOVERY_ENDPOINT: ${RUBIKA_DISCOVERY_ENDPOINT:-https://getdcmess.iranlms.ir/}
      RUBIKA_API_ENDPOINT: ${RUBIKA_API_ENDPOINT:-}
      RUBIKA_SOCKET_ENDPOINT: ${RUBIKA_SOCKET_ENDPOINT:-}
      APP_WEBHOOK: ${APP_WEBHOOK:-}
      APP_WEBHOOK_SECRET: ${APP_WEBHOOK_SECRET:-}
      APP_WEBHOOK_DEVICE_MERGE_GLOBAL: ${APP_WEBHOOK_DEVICE_MERGE_GLOBAL:-false}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1,host.docker.internal}
    volumes:
      - gateway-data:/app/storages
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:size=67108864,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
volumes:
  gateway-data:
    name: ${APP_DATA_VOLUME:-goomni-data}
