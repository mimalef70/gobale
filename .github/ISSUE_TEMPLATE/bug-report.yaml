name: Bug report
description: Report a reproducible GoOmni problem without private data.
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For security vulnerabilities, use SECURITY.md instead of a public issue.
        Never attach sessions, tokens, phone numbers, messages, database files, or raw captures.
  - type: input
    id: version
    attributes:
      label: GoOmni version or commit
      description: Include the image digest if using Docker.
      placeholder: v0.2.0-alpha.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, binary or Docker, default or purego SQLite.
      placeholder: Ubuntu 24.04, amd64, Docker
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal steps using synthetic identities and content.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
      description: Include endpoint, HTTP/error code, and operation states where relevant.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Optional short logs. Remove all account and message data before posting.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I removed credentials, account identifiers, private content, and signed URLs.
          required: true
        - label: I checked the documentation and existing issues for this behavior.
          required: true
