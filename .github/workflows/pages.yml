name: API documentation

on:
  push:
    branches: [main]
    paths: ['docs/**', 'scripts/build_docs.py', 'scripts/requirements.txt', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned documentation tooling
        run: |
          python3 -m venv "$RUNNER_TEMP/goomni-docs-venv"
          "$RUNNER_TEMP/goomni-docs-venv/bin/python" -m pip install --requirement scripts/requirements.txt
          echo "$RUNNER_TEMP/goomni-docs-venv/bin" >> "$GITHUB_PATH"
      - run: python3 scripts/build_docs.py --output site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
