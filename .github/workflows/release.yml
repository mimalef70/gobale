name: Prepare and publish release
run-name: Release ${{ inputs.tag }}

# Publication is deliberately manual. A tag push only runs the read-only CI.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag whose GoBale CI has passed (for example v1.0.0 or v1.1.0-rc.1)
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.26.9'
  GOTOOLCHAIN: local
  # Public image names must not cross job outputs: Actions can suppress an
  # output containing the Docker Hub username when that username is a secret.
  GHCR_IMAGE: ghcr.io/mimalef70/gobale
  DOCKERHUB_IMAGE: docker.io/mimalef70/gobale

jobs:
  prepare:
    name: Verify tag and package binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      packages: read
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - name: Require an explicit SemVer release tag and publishing credentials
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, re
          tag = os.environ['RELEASE_TAG']
          assert re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-(alpha|beta|rc)\.[1-9][0-9]*)?', tag), 'Use an explicit vMAJOR.MINOR.PATCH tag, optionally followed by -alpha.N, -beta.N or -rc.N'
          assert os.environ['DOCKERHUB_USERNAME'].strip() and os.environ['DOCKERHUB_TOKEN'].strip(), 'Configure DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets before publication'
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable revision and successful CI
        id: identity
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          from scripts.release_notes import release_metadata
          tag = os.environ['RELEASE_TAG']
          release_metadata(tag)
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          tagged = subprocess.check_output(['git', 'rev-parse', '--verify', 'refs/tags/' + tag + '^{commit}'], text=True).strip()
          assert sha == tagged, 'Checkout does not match the tag'
          assert os.environ['GITHUB_REF'] == 'refs/heads/main' and os.environ['GITHUB_SHA'] == sha, 'Dispatch the reviewed tag revision from main; workflow and release code must match'
          subprocess.run(['git', 'merge-base', '--is-ancestor', sha, 'origin/main'], check=True)
          runs = json.loads(subprocess.check_output(['gh', 'run', 'list', '--workflow', 'ci.yml', '--commit', sha, '--event', 'push', '--limit', '1', '--json', 'status,conclusion,headSha'], text=True))
          assert runs and runs[0]['headSha'] == sha and runs[0]['status'] == 'completed' and runs[0]['conclusion'] == 'success', 'Latest push CI for this exact revision must finish successfully before dispatch'
          subprocess.run(['python3', 'scripts/release_notes.py', '--version', tag], check=True, stdout=subprocess.DEVNULL)
          # Abort before pushing an image when this release already exists.
          # A network/authentication error must not be treated as a missing release.
          import re
          existing = subprocess.run(['gh', 'api', '--include', 'repos/' + os.environ['GITHUB_REPOSITORY'] + '/releases/tags/' + tag], text=True, capture_output=True)
          status = re.findall(r'^HTTP/\S+\s+(\d+)', existing.stdout, re.MULTILINE)
          assert existing.returncode != 0 and status and status[-1] == '404', 'Release already exists or its absence could not be verified; inspect before retrying'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('sha=' + sha + '\nversion=' + tag[1:] + '\n')
          PY
      - name: Verify both registry version tags are absent before packaging
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: python3 scripts/release_registry.py absent --tag "$RELEASE_TAG"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: src/go.sum
      - name: Install pinned documentation tooling
        run: |
          python3 -m venv "$RUNNER_TEMP/gobale-docs-venv"
          "$RUNNER_TEMP/gobale-docs-venv/bin/python" -m pip install --requirement scripts/requirements.txt
          echo "$RUNNER_TEMP/gobale-docs-venv/bin" >> "$GITHUB_PATH"
      - name: Verify contracts and dependencies
        run: |
          make contracts
          cd src
          go mod download
          go mod verify
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.12.0'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Package all supported platforms
        env:
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
        run: python3 scripts/package_release.py --version "$RELEASE_VERSION" --output dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-packages
          path: dist/
          if-no-files-found: error
          retention-days: 7

  image:
    name: Publish the same versioned image to both registries
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Recheck both version tags immediately before publication
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: python3 scripts/release_registry.py absent --tag "$RELEASE_TAG"
      - name: Build once and publish both architectures with provenance and SBOM
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/golang.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ inputs.tag }}
            ${{ env.DOCKERHUB_IMAGE }}:${{ inputs.tag }}
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            REVISION=${{ needs.prepare.outputs.sha }}
          labels: |
            org.opencontainers.image.title=GoBale
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.licenses=MIT
      - name: Verify both registry indexes match the built digest
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: python3 scripts/release_registry.py published --tag "$RELEASE_TAG" --digest "$IMAGE_DIGEST"

  release:
    name: Publish verified assets and release notes
    needs: [prepare, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-packages
          path: dist
      - name: Verify archive checksums
        run: cd dist && sha256sum --check SHA256SUMS
      - name: Create draft, attach assets, and publish reviewed release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          IMAGE: ${{ env.GHCR_IMAGE }}
          DOCKERHUB_IMAGE: ${{ env.DOCKERHUB_IMAGE }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
          EXPECTED_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re, subprocess
          from scripts.release_notes import release_metadata
          tag = os.environ['RELEASE_TAG']
          metadata = release_metadata(tag)
          publication_flags = ['--prerelease=' + str(metadata['prerelease']).lower(), '--latest=' + str(metadata['latest']).lower()]
          # A draft cannot be the latest release; promote only after assets exist.
          draft_flags = ['--prerelease=' + str(metadata['prerelease']).lower(), '--latest=false']
          digest = os.environ['IMAGE_DIGEST']
          assert re.fullmatch(r'sha256:[a-f0-9]{64}', digest), 'Image publication did not return a valid digest'
          notes = subprocess.check_output(['python3', 'scripts/release_notes.py', '--version', tag], text=True)
          body = notes + '\n\nContainer images (same multi-platform build):\n'
          for image in (os.environ['IMAGE'], os.environ['DOCKERHUB_IMAGE']):
              body += '\n- `' + image + ':' + tag + '` — immutable reference: `' + image + '@' + digest + '`\n'
          notes_file = pathlib.Path(os.environ['RUNNER_TEMP']) / 'gobale-release-notes.md'
          notes_file.write_text(body)
          archives = sorted(str(p) for p in pathlib.Path('dist').glob('*.tar.gz'))
          assert len(archives) == 4, 'Expected four platform archives'
          remote_sha = subprocess.check_output(['gh', 'api', 'repos/' + os.environ['GITHUB_REPOSITORY'] + '/commits/' + tag, '--jq', '.sha'], text=True).strip()
          assert remote_sha == os.environ['EXPECTED_SHA'], 'Version tag moved after verification; publication aborted'
          # No --clobber: a published release must never be silently replaced.
          subprocess.run(['gh', 'release', 'create', tag, '--verify-tag', '--draft', *draft_flags, '--title', 'GoBale ' + tag, '--notes-file', str(notes_file)], check=True)
          subprocess.run(['gh', 'release', 'upload', tag, *archives, 'dist/SHA256SUMS', 'dist/manifest.json'], check=True)
          subprocess.run(['gh', 'release', 'edit', tag, '--draft=false', *publication_flags], check=True)
          PY


  verify-public:
    name: Public installation (${{ matrix.arch }})
    needs: [prepare, image, release]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Verify anonymous assets, exact tag revision and both public registry indexes
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ needs.prepare.outputs.sha }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
        run: python3 scripts/verify_release.py --tag "$RELEASE_TAG" --sha "$EXPECTED_SHA" --digest "$IMAGE_DIGEST" --output "$RUNNER_TEMP/public-release.json"
      - name: Pull anonymously and verify clean-storage restart on the native architecture
        env:
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
          DOCKER_CONFIG: ${{ runner.temp }}/gobale-anonymous-docker
        run: |
          mkdir -p "$DOCKER_CONFIG"
          for image in "$GHCR_IMAGE" "$DOCKERHUB_IMAGE"; do
            docker pull "$image@$IMAGE_DIGEST"
            python3 scripts/docker_smoke.py "$image@$IMAGE_DIGEST"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-verification-${{ matrix.arch }}
          path: ${{ runner.temp }}/public-release.json
          if-no-files-found: error
          retention-days: 30
